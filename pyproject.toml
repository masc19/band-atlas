[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "band-atlas"
version = "0.1.0"
description = "Personalised scene atlas engine for developing music acts: shared researched facts, per-artist judgments, single-file HTML output."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
model = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
band-atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]
include-package-data = true

[tool.setuptools.package-data]
atlas = ["template.html"]
