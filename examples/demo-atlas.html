<style>
:root{
  --bg:#0b0908; --bg2:#141010; --bg3:#1c1614; --line:#2a211c; --line2:#3a2d24;
  --fg:#e8dcc8; --fg2:#c9bba2; --fg3:#94856f; --fg4:#5f5546;
  --acc:#EF7A37; --acc2:#ffb054; --accdim:#5a2c10;
  --green:#7fb069; --yellow:#e7b52d; --red:#c05b4d; --cold:#5fb6c9;
  --navbg:rgba(11,9,8,.96); --onacc:#0b0908; --accsoft:rgba(239,122,55,.08);
  --cardshadow:none; --cardshadowh:none; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eeebe6; --bg2:#fbfaf7; --bg3:#f4f1ec; --line:#e2dcd3; --line2:#cdc4b8;
  --fg:#1c1510; --fg2:#3b3129; --fg3:#675b50; --fg4:#85786a;
  --acc:#c24f0c; --acc2:#e0621a; --accdim:#efc6a8;
  --green:#4a8534; --yellow:#9a7100; --red:#ad3f2d; --cold:#23809a;
  --navbg:rgba(238,235,230,.93); --onacc:#fff; --accsoft:rgba(194,79,12,.07);
  --cardshadow:0 1px 2px rgba(70,45,20,.05),0 1px 1px rgba(70,45,20,.03); --cardshadowh:0 4px 14px rgba(70,45,20,.08); color-scheme:light;
}
:root[data-theme="light"] body{background:radial-gradient(1200px 500px at 85% -120px, rgba(224,98,26,.07), transparent 70%),var(--bg);background-attachment:fixed}
html.thm-anim, html.thm-anim *{transition:background-color .35s ease,border-color .35s ease,color .35s ease!important}
@media(prefers-reduced-motion:reduce){html.thm-anim, html.thm-anim *{transition:none!important}}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:'Rubik',system-ui,sans-serif;font-weight:300;line-height:1.6;font-size:16px}
a{color:var(--acc);text-decoration:none;transition:color .2s}a:hover{color:var(--acc2)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.26em;color:var(--acc);text-transform:uppercase}
nav.sw{position:sticky;top:0;z-index:60;background:var(--navbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navtop{display:flex;align-items:center;gap:16px;padding:7px 24px 5px;max-width:1240px;margin:0 auto}
.brand{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.28em;color:var(--fg);white-space:nowrap;text-transform:uppercase}
.brand b{color:var(--acc);font-weight:700}
.usearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 16px;transition:border-color .15s}
.usearch:focus-within{border-color:var(--acc)}
.usearch svg{flex:none;opacity:.5}
.usearch input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-family:'Rubik',sans-serif;font-size:14px;min-width:0;width:100%}
.usearch .clr{cursor:pointer;color:var(--fg4);font-family:'JetBrains Mono',monospace;font-size:12px;border:0;background:none;padding:0 2px}
.usearch .clr:hover{color:var(--fg)}
.tabsrow{position:relative;max-width:1240px;margin:0 auto;padding:0 24px}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:2px 30px 8px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabsrow:after{content:"";position:absolute;top:0;right:0;bottom:8px;width:56px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg) 85%)}
.tab{flex:none;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;background:none;transition:all .18s;white-space:nowrap}
.tab:hover{color:var(--fg);border-color:var(--line2)}
.tab.on{color:var(--onacc);background:var(--acc);border-color:var(--acc);font-weight:500}
.thm{flex:none;position:relative;display:inline-flex;align-items:center;height:30px;padding:3px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer}
.thm:hover{border-color:var(--acc)}
.thm .opt{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);transition:color .3s}
.thm .opt svg{width:13px;height:13px}
.thm .knob{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--acc);transition:transform .3s cubic-bezier(.4,.1,.2,1),width .3s}
.thm[data-on="dark"] .opt.d, .thm[data-on="light"] .opt.l{color:var(--onacc)}
.tabhead{padding:12px 0 0}
.titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabhead h1{font-weight:800;font-size:clamp(17px,2.3vw,24px);letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg4)}
.qbtn{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--fg3);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;line-height:1;transition:all .15s}
.qbtn:hover{color:var(--acc);border-color:var(--acc)}
.qbtn.on{color:var(--onacc);background:var(--acc);border-color:var(--acc)}
.infopanel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0 2px}
.infopanel .sub{color:var(--fg2);max-width:980px;font-size:14px;margin-bottom:4px}
.infopanel .mhead{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.infopanel p{color:var(--fg2);font-size:13.5px;max-width:980px;margin-bottom:6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--fg3);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:none;transition:all .15s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--acc);border-color:var(--acc);background:var(--accsoft)}
select.sort{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--fg2);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;outline:none;cursor:pointer;max-width:100%}
select.sort:focus{border-color:var(--acc)}
.grp{margin:28px 0 6px}
.grphead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.grphead .kicker{font-size:12px}
.grpnote{color:var(--fg3);font-size:13.5px;max-width:900px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:8px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 16px 13px;cursor:pointer;transition:border-color .15s,box-shadow .2s;box-shadow:var(--cardshadow)}
.card:hover{border-color:var(--line2);box-shadow:var(--cardshadowh)}
.card.open{grid-column:1/-1;cursor:default;border-color:var(--accdim)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cname{font-weight:600;font-size:16.5px;line-height:1.3}
.csub{color:var(--fg3);font-size:12.5px;font-family:'JetBrains Mono',monospace;margin-top:3px;letter-spacing:.02em}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.bdg{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid var(--line2);color:var(--fg3)}
.bdg.fill{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:500}
.bdg.mid{color:var(--yellow);border-color:var(--yellow)}
.bdg.cold{color:var(--cold);border-color:var(--cold)}
.bdg.dead{background:var(--fg4);border-color:var(--fg4);color:var(--bg2)}
.bdg.grn{color:var(--green);border-color:var(--green)}
.bdg.warn{color:var(--red);border-color:var(--red)}

.card.open .cteaser{display:none}
.cbody{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.card.open .cbody{display:block}

.kv dt{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4);padding-top:2px}
.kv dd{color:var(--fg2)}

.kv.warn dd{color:var(--yellow)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lnk{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;border:1px solid var(--accdim);border-radius:999px;padding:4px 12px}
.dots{letter-spacing:2px;color:var(--acc);font-size:12px}
.dots span.off{color:var(--line2)}
.scrow{display:flex;gap:20px;flex-wrap:wrap;padding:8px 0 2px}
.scitem{font-size:12.5px;color:var(--fg3)}
.scitem b{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg4);font-weight:400;margin-bottom:2px}
.scitem .num{color:var(--fg2);font-family:'JetBrains Mono',monospace;font-size:11px;margin-left:6px}
.flag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow);border:1px solid var(--yellow);border-radius:999px;padding:1px 7px;margin-right:4px}
.ureshead{padding:30px 0 4px}
.uressec .grphead .kicker{color:var(--fg2)}
.empty{color:var(--fg4);padding:20px 0;font-family:'JetBrains Mono',monospace;font-size:12px}

  .navtop{gap:10px;padding:6px 16px 4px} .brand{font-size:11px;letter-spacing:.16em}

}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ORDER = ["now","reach","attend","above","avoid","dead"];
const GL = {now:"Approach now", reach:"Reach · 12–24 months", attend:"Attend · network, don't apply", above:"Above current level", avoid:"Avoid", dead:"Folded · dormant · unverified"};
const GLS = {now:"P1 · Act this month", reach:"P2 · Next 1–3 months", attend:"P3 · Rehearsal / networking", above:"Above level", avoid:"Avoid · pay-to-play / poor fit", dead:"Closed"};
const GNOTE = {
  now:"Doors that are open to this act as it stands today — a published route, requirements met or nearly met. Everything here can be started this month.",
  reach:"Realistic inside twelve to twenty-four months once the gap named on each card is closed — usually a release, a live video or draw.",
  attend:"Worth the room, not the application: stages booked through partners, open calls structurally closed, or slots too short to build fans. Go, meet people, don't pitch yet.",
  above:"The ceiling. Useful as a map of where this ends up; useless as a plan for this year. Nothing here books an act at this draw.",
  avoid:"Conflicts with a red line in the profile, a format rule that excludes the act, or terms that cost more than they return.",
  dead:"Not live targets. Kept so a stale aggregator listing doesn't send anyone chasing them."
};
const BADGE = {now:"fill", reach:"mid", attend:"cold", above:"", avoid:"warn", dead:"dead"};
const ACT = {0:"Closed", 1:"No open door", 2:"Submission form", 3:"Published contact"};
const SORTS = [["group","Sort: strategy, then likelihood"],["likelihood","Sort: likelihood"],["impact","Sort: impact"],["fit","Sort: fit"],["az","Sort: A–Z"]];
// Display names for the three scores, per tab. Data, rules and eval always use impact / fit / likelihood;
// this only changes the words on the card so an artist reads "Signing odds" on a label and "Likelihood now" on a festival.
const SCORE_NAMES = {
  labels:       ["Impact", "Sound fit", "Demo odds"],
  distributors: ["Value", "Needs match", "Ease"],
  collabs:      ["Reach", "Sound fit", "Reply odds"],
  open_stages:  ["Slot value", "Fit (sound + rig)", "Odds this month"],
  festivals:    ["Career impact", "Sound fit", "Odds this year"],
  showcases:    ["Career impact", "Relevance", "Odds this year"],
  bookers:      ["Impact", "Lane fit", "Booking odds"],
  promoters:    ["Impact", "Lane fit", "Booking odds"],
  agents:       ["Impact", "Lane fit", "Signing odds"],
};
function scoreNames(cat){ return SCORE_NAMES[cat] || ["Impact", "Fit", "Likelihood"]; }
const state = {tab:(D.categories[0]||{}).id||"", q:"", grp:"all", sort:"group", open:{}, info:false};

// theme
const thm = document.getElementById("thm");
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); thm.dataset.on = t; try{localStorage.setItem("atlas-theme", t)}catch(e){} placeKnob(); }
function placeKnob(){ const on = thm.querySelector(thm.dataset.on==="dark"?".opt.d":".opt.l"); const k = thm.querySelector(".knob"); if(on){ k.style.width = on.offsetWidth+"px"; k.style.transform = "translateX("+(on.offsetLeft-3)+"px)"; } }
thm.addEventListener("click", ()=>{ document.documentElement.classList.add("thm-anim"); applyTheme(thm.dataset.on==="dark"?"light":"dark"); setTimeout(()=>document.documentElement.classList.remove("thm-anim"), 400); });
thm.dataset.on = document.documentElement.getAttribute("data-theme")||"dark";
window.addEventListener("load", placeKnob); window.addEventListener("resize", placeKnob);

// brand + tabs
document.getElementById("brand").innerHTML = esc(D.artist).replace(/^(\S+)\s?(.*)$/, (m,a,b)=> `${esc(a)}${b?" <b>"+esc(b)+"</b>":""}`) + " ATLAS";
const tabsEl = document.getElementById("tabs");
function renderTabs(){ tabsEl.innerHTML = D.categories.map(c => `<button class="tab${c.id===state.tab&&!state.q?" on":""}" data-c="${c.id}">${esc(c.label)}</button>`).join(""); }
tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab"); if(!b) return; state.tab = b.dataset.c; state.q = ""; uq.value = ""; uqclr.style.display = "none"; state.grp = "all"; render(); window.scrollTo({top:0}); });

// search
const uq = document.getElementById("uq"), uqclr = document.getElementById("uqclr");
uq.addEventListener("input", ()=>{ state.q = uq.value; uqclr.style.display = state.q ? "" : "none"; render(); });
uqclr.addEventListener("click", ()=>{ uq.value=""; state.q=""; uqclr.style.display="none"; render(); });

function dots(n){ const k = Math.round(n/2); let s=""; for(let i=0;i<5;i++) s += `<span${i<k?"":' class="off"'}>●</span>`; return `<span class="dots">${s}</span>`; }
function kv(dt, dd, cls){ return dd ? `<dl class="kv${cls?" "+cls:""}"><dt>${esc(dt)}</dt><dd>${dd}</dd></dl>` : ""; }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } }
function groupLabel(cat, g){ return cat==="open_stages" ? GLS[g] : GL[g]; }

function card(r){
  const j = r.j, st = r.stage||{}, open = !!state.open[r.id], sn = scoreNames(r.category);
  const stageLine = r.category==="open_stages" ? [st.format&&st.format.replace(/_/g," "), st.set_minutes?st.set_minutes+" min":""].filter(Boolean).join(" · ") : "";
  const when = (r.when||"").length > 48 ? r.when.slice(0,46).replace(/\s\S*$/,"")+"…" : r.when;
  const showGroupBadge = !!state.q || state.sort!=="group" || state.grp!=="all";
  const sub = [r.city, r.country, when].filter(Boolean).join(" · ");
  const flags = (j.flags||[]).map(f=>`<span class="flag">${esc(f)}</span>`).join("");
  const seenU = new Set(); const links = [r.url?{u:r.url,t:"Website"}:null].concat((r.sources||[]).map(u=>({u,t:host(u)}))).filter(l => l && !seenU.has(l.u.replace(/\/$/,"")) && seenU.add(l.u.replace(/\/$/,"")));
  return `<div class="card${open?" open":""}" data-id="${esc(r.id)}">
    <div class="chead">
      <div><div class="cname">${esc(r.name)}</div><div class="csub">${esc(sub)}${stageLine?` · ${esc(stageLine)}`:""}</div></div>
      <div class="badges">${showGroupBadge?`<span class="bdg ${BADGE[j.group]}">${esc(groupLabel(r.category,j.group).split(" ·")[0])}</span>`:""}${r.act!=null?`<span class="bdg">${ACT[r.act]}</span>`:""}</div>
    </div>
    <div class="cteaser">${esc(j.why)}</div>
    <div class="cbody">
      ${kv("The read", esc(j.why), "hot")}
      ${j.route && j.route!==r.apply ? kv("Route", esc(j.route)) : ""}
      ${kv("About", esc(r.summary))}
      ${st.gear?kv("Gear", esc(st.gear)):""}
      ${r.when?kv("When", esc(r.when)):""}
      ${r.trace&&r.trace.length?kv("Roster trace", esc(r.trace.join(", "))):""}
      ${kv("How", esc(r.apply))}
      ${kv("Contact", esc(r.contact), "hot")}
      ${kv("Cost", esc(r.cost))}
      ${kv("Verified", esc(r.verify), /not confirmed|unconfirmed|could not|blocked|re-?verify/i.test(r.verify||"")?"warn":"")}
      ${kv("Seen", esc(r.seen) + (flags?" &nbsp;"+flags:""))}
      <div class="scrow">
        <div class="scitem"><b>${esc(sn[0])}</b>${dots(j.impact)}<span class="num">${j.impact}/10</span></div>
        <div class="scitem"><b>${esc(sn[1])}</b>${dots(j.fit)}<span class="num">${j.fit}/10</span></div>
        <div class="scitem"><b>${esc(sn[2])}</b>${dots(j.likelihood)}<span class="num">${j.likelihood}/10</span></div>
      </div>
      ${links.length?`<div class="links">${links.map(l=>`<a class="lnk" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join("")}</div>`:""}
    </div>
  </div>`;
}

function sorted(rs){
  const key = {impact:r=>-r.j.impact, fit:r=>-r.j.fit, likelihood:r=>-r.j.likelihood, az:r=>r.name.toLowerCase()}[state.sort];
  if(key) return rs.slice().sort((a,b)=> key(a)<key(b)?-1:key(a)>key(b)?1:0);
  return rs.slice().sort((a,b)=> ORDER.indexOf(a.j.group)-ORDER.indexOf(b.j.group) || (b.j.likelihood-a.j.likelihood) || (b.j.impact-a.j.impact));
}
function groupsHtml(cat, rs){
  return ORDER.filter(g => rs.some(r=>r.j.group===g)).map(g => {
    const items = rs.filter(r=>r.j.group===g);
    return `<section class="grp"><div class="grphead"><span class="kicker">${esc(groupLabel(cat,g))}</span><span class="count">${items.length}</span></div>
      <p class="grpnote">${esc(GNOTE[g])}</p><div class="grid">${items.map(card).join("")}</div></section>`;
  }).join("");
}
function matches(r, q){ return (r.name+" "+r.city+" "+(r.trace||[]).join(" ")+" "+r.summary+" "+r.j.why).toLowerCase().includes(q); }

function render(){
  renderTabs();
  const view = document.getElementById("view");
  if(state.q.trim()){
    const q = state.q.trim().toLowerCase();
    const hits = D.records.filter(r => matches(r, q));
    let h = `<div class="ureshead"><span class="kicker">Search</span><h1 style="text-transform:none;letter-spacing:0;font-weight:800;font-size:22px">“${esc(state.q.trim())}”</h1><div class="count">${hits.length} result${hits.length===1?"":"s"} across ${new Set(hits.map(r=>r.category)).size} tabs</div></div>`;
    for(const c of D.categories){ const rs = sorted(hits.filter(r=>r.category===c.id)); if(!rs.length) continue;
      h += `<section class="grp uressec"><div class="grphead"><span class="kicker">${esc(c.label)}</span><span class="count">${rs.length}</span></div><div class="grid">${rs.map(card).join("")}</div></section>`; }
    if(!hits.length) h += `<div class="empty">No matches anywhere.</div>`;
    view.innerHTML = h; return;
  }
  const cat = D.categories.find(c=>c.id===state.tab) || D.categories[0];
  const all = D.records.filter(r=>r.category===cat.id);
  const rs = sorted(all.filter(r => state.grp==="all" || r.j.group===state.grp));
  const groupsPresent = ORDER.filter(g => all.some(r=>r.j.group===g));
  let h = `<div class="tabhead"><div class="titlerow"><h1>${esc(cat.label)}</h1><span class="count">${all.length}</span><button class="qbtn${state.info?" on":""}" id="qbtn" title="About this tab">?</button></div>
    ${state.info?`<div class="infopanel"><div class="sub">${esc(cat.sub||"")}</div><div class="mhead">How to read it</div><p>Every card shows three scores computed for this profile: <b>impact</b> (how much it would move the act), <b>fit</b> (how naturally the sound and format sit in what they book), <b>likelihood</b> (odds of a yes at the current stage). The strategy groups — Approach now / Reach / Attend / Above / Avoid — are the read; the sort cuts across them.</p><p>Facts (contact, route, verify note, sources, seen date) are shared research; the scores and the reasons are this profile's only. Published contacts only; nothing here was guessed. Re-verify anything older than six months before you act.</p></div>`:""}
    <div class="toolbar"><select class="sort" id="sort">${SORTS.map(([v,l])=>`<option value="${v}"${v===state.sort?" selected":""}>${l}</option>`).join("")}</select>
      <div class="chips"><button class="chip${state.grp==="all"?" on":""}" data-g="all">All groups</button>${groupsPresent.map(g=>`<button class="chip${state.grp===g?" on":""}" data-g="${g}">${esc(groupLabel(cat.id,g).split(" ·")[0])}</button>`).join("")}</div></div></div>`;
  h += (state.sort==="group" && state.grp==="all") ? groupsHtml(cat.id, rs) : `<section class="grp"><div class="grid" style="margin-top:12px">${rs.map(card).join("")}</div></section>`;
  if(!rs.length) h += `<div class="empty">Nothing in this view.</div>`;
  view.innerHTML = h;
  document.getElementById("qbtn").onclick = ()=>{ state.info = !state.info; render(); };
  document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
}
document.getElementById("view").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if(chip){ state.grp = chip.dataset.g; render(); return; }
  if(e.target.closest("a")) return;
  const c = e.target.closest(".card"); if(!c) return;
  const id = c.dataset.id;
  if(e.target.closest(".cbody")) return;
  state.open[id] = !state.open[id]; render();
  if(state.open[id]){ const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if(el){ const y = el.getBoundingClientRect().top + window.scrollY - 110; if(y < window.scrollY) window.scrollTo({top:y}); } }
});
document.getElementById("foot").innerHTML = `${esc(D.artist)} · ${esc(D.lane)} · ${esc(D.home)} · built ${esc(D.built)} · facts are shared research with sources and seen-dates; scores and groups are computed for this profile only.`;
render();
</script>
</body>
</html>
